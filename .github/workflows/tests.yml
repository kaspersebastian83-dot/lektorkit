name: Prüfungen

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefungen:
    name: LektorKit (Kopien + Chromium, erfundene Daten)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Projektzentrale, ResultKit, BerichtKit daneben holen (Originale der kopierten Regeln)
        run: |
          for r in projektzentrale resultkit berichtkit; do
            git clone --quiet --depth 1 "https://github.com/kaspersebastian83-dot/$r.git" "../$r"
          done
      - name: index.html aus src/ und den Originalen gebaut?
        run: |
          node tools/einbetten.cjs ../projektzentrale
          git diff --exit-code -- index.html || (echo "::error title=index.html::nicht neu gebaut oder ein Original hat sich geändert – node tools/einbetten.cjs ../projektzentrale" && exit 1)
      - name: Playwright installieren (fest, nicht im Repository)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Prüfungen a–k
        run: node tests/lektorkit-check.cjs alle
      - name: Bildschirmfotos bei Fehlschlag
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bildschirmfotos
          path: tests/out/
